# quiccochet tunnel — foreign-main (client), tier "high"
#
# Every key below is optional: leaving it out gives you the tier default
# shown as the value. Anything you write here wins over the preset.

name = "foreign-main"
role = "client"        # server listens, client dials
tier = "high"        # light | medium | high | ultra

# ── Layer-3 interface ────────────────────────────────────────────────
# Created once at startup and kept up for the process lifetime. A session
# drop never tears it down, so routes and iptables rules stay valid.
[tun]
name    = "qc0"
local   = "10.20.0.2/30"
peer    = "10.20.0.1"
mtu     = 1360
queues  = 0               # multiqueue fds; 0 = one per worker
persist = true

# ── Spoofed UDP transport ────────────────────────────────────────────
[transport]
listen         = "0.0.0.0:6262"
peer           = "203.0.113.9:6262"   # real address of the other side
# Addresses we send FROM. The kernel builds the IP header; the source is
# overridden per packet with an IP_PKTINFO cmsg, which keeps GSO and
# checksum offload intact (unlike a raw IP_HDRINCL socket).
spoof_src      = ["5.34.222.2"]
# Addresses we accept traffic FROM. Empty means accept any source.
spoof_expect   = ["62.60.212.216"]
transparent    = true             # IP_TRANSPARENT; required for a non-local source
rcv_buffer_mb  = 24
snd_buffer_mb  = 24
force_buffers  = true             # try SO_RCVBUFFORCE before the rmem_max cap
gso            = true
gro            = true

# Probe each spoof source in turn; quarantine one that stops getting
# replies so a single blackholed address cannot take the tunnel down.
[transport.health]
enabled        = true
interval_sec   = 15
timeout_sec    = 5
fail_threshold = 3
quarantine_sec = 120

# ── QUIC session pool ────────────────────────────────────────────────
# Payload rides in DATAGRAM frames (RFC 9221), never in streams: a lost
# packet is not retransmitted underneath the inner flow's own recovery.
[quic]
pool_size             = 8
keep_alive_period_sec = 8
max_idle_timeout_sec  = 30
handshake_timeout_sec = 10
initial_packet_size   = 1350
disable_pmtud         = false
congestion_control    = "cubic"      # cubic | auto  (see docs/CONGESTION.md)
datagram_queue        = 1024
reconnect_min_ms      = 250
reconnect_max_ms      = 15000

# ── Crypto ───────────────────────────────────────────────────────────
[crypto]
# "auto" picks AES-256-GCM when the CPU has AES-NI, ChaCha20-Poly1305
# otherwise. Run "quiccochet cpuinfo" to see what this box will choose.
cipher = "auto"
# What the handshake claims to be talking to. Nothing verifies it — its
# only job is to look ordinary to whatever is watching the connection.
sni    = "www.cloudflare.com"
alpn   = ["h3"]

# Same value on both sides. Generate one with: quiccochet genpsk
psk    = "CHANGE-ME-both-sides-must-match"

# ── Obfuscation ──────────────────────────────────────────────────────
# Padding is applied inside the QUIC datagram, not at the socket, so it
# never defeats GSO. "none" is the fastest and already looks like QUIC.
[obfuscation]
mode      = "binning"        # none | binning | standard | paranoid
bin_size  = 256              # round frame length up to a multiple of this
chaff_pps = 0                # cover packets per second; 0 = off
jitter_us = 0                # send-side jitter; costs latency, buy carefully

# ── Datapath ─────────────────────────────────────────────────────────
[datapath]
workers     = 4               # 0 = one per available core
pin_cores   = true
cores       = []              # explicit affinity list; empty = 0..n-1
coalesce    = true             # pack several small IP packets per datagram
coalesce_us = 100              # how long a partial batch may wait
batch_size  = 64

# ── Management ───────────────────────────────────────────────────────
[admin]
socket = "/run/quiccochet/foreign-main.sock"

[metrics]
enabled = true
listen  = "127.0.0.1:9808"

[log]
level = "info"          # error | warn | info | debug
